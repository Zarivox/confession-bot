site_name: Confession Bot
site_description: Discord bot for anonymous and identified confessions, with vote, contract opt-in, and admin moderation tools.
site_author: Zarivox
repo_url: https://github.com/Zarivox/confession-bot
repo_name: Zarivox/confession-bot
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    logo: material/message-text-lock-outline

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
    - getting-started/index.md
    - Configuration: getting-started/configuration.md
    - Deployment: getting-started/deployment.md
  - Commands:
    - commands/index.md
    - User commands: commands/user.md
    - Admin commands: commands/admin.md
  - Architecture:
    - architecture/index.md
    - Storage layout: architecture/storage.md
    - Privacy at rest: architecture/privacy.md
    - Bot lifecycle: architecture/lifecycle.md
  - Customization: customization.md
  - FAQ: faq.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Zarivox/confession-bot
